[tool.black]
line-length = 88
skip-string-normalization = true
skip-magic-trailing-comma = false

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["D"]
ignore = ["D203", "D212", "D200", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

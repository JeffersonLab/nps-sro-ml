[project]
name = "nps-sro-ml"
description = "AI/ML application on Streaming Readout Data in NPS experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "scipy>=1.12.0",
    "tensorboard>=2.20.0",
    "torch==2.9.0",
    "black",
    "ruff"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.black]
line-length = 88
skip-string-normalization = true
skip-magic-trailing-comma = false

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["D"]
ignore = ["D203", "D212", "D200", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[project]
name = "nps-sro-ml"
description = "AI/ML application on Streaming Readout Data in NPS experiment"
readme = "README.md"
requires-python = ">=3.10"
# Install examples:
#   uv sync --extra torch-cpu
#   uv sync --extra torch-cu130
#   uv sync --extra torch-cu130 --extra pyg
#   uv sync --extra torch-cu130 --extra pyg-ext-cu130
dependencies = [
    "numpy>=1.26.2",
    "pandas>=2.1.3",
    "scipy>=1.12.0",
    "tensorboard>=2.20.0",
    "black",
    "ruff",
]

[project.optional-dependencies]
torch-cpu = [
    "torch==2.9.0",
]
torch-cu126 = [
    "torch==2.9.0",
]
torch-cu128 = [
    "torch==2.9.0",
]
torch-cu130 = [
    "torch==2.9.0",
]
pyg = [
    "torch-geometric",
]
pyg-ext-cpu = [
    "torch-geometric",
    "pyg-lib",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
]
pyg-ext-cu126 = [
    "torch-geometric",
    "pyg-lib",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
]
pyg-ext-cu128 = [
    "torch-geometric",
    "pyg-lib",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
]
pyg-ext-cu130 = [
    "torch-geometric",
    "pyg-lib",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
